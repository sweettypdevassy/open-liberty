adoptionMetrics=Adoption metrics
adoptionMetrics.desc=Configuration for the adoption metrics that the server writes for collection by IBM License Metric Tool.

enabled=Adoption metrics enabled
enabled.desc=Specifies whether the server periodically writes adoption metrics files for IBM License Metric Tool. The files stay on the local file system until IBM License Metric Tool collects them.

customerId=Customer ID
customerId.desc=An optional customer identifier that is included in the adoption metrics.

environmentType=Environment type
environmentType.desc=Specifies whether this server runs in a production or non-production environment. The server cannot detect this value itself.
environmentType.production=Production
environmentType.nonProduction=Non-production
environmentType.unknown=Unknown
